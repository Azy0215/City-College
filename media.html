<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Media - City College</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page inner-page">

    <div class="page-header">

        <img src="city college logo.png"
             alt="City College Logo">

        <div>
            <p class="welcome-small">EXPERIENCE</p>
            <h1>MEDIA</h1>
        </div>

    </div>


    <section class="content-box">

        <h2> MUSIC</h2>

        <p>
            <strong>Musika</strong>
        </p>

        <audio controls>

            <source src="musika.mp3"
                    type="audio/mpeg">

            Your browser does not support audio.

        </audio>

    </section>


    <section class="content-box">

        <h2>VIDEO</h2>

        <video controls class="college-video">

            <source src="padaba taka.mp4"
                    type="video/mp4">

            Your browser does not support video.

        </video>

    </section>
    <footer>
        <p>
            <small>City College Media Center</small>
        </p>
    </footer>

</div>

</body>

</html>
