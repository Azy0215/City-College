<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Enrollment Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="enrollment-page">
        <h1>ENROLLMENT FORM</h1>
        <form>
           <fieldset>
               <legend>Student Information</legend>

               <label for="last-name">Last Name</label>
               <input id="last-name" type="text" name="last_name" autocomplete="family-name" required>

               <label for="first-name">First Name</label>
               <input id="first-name" type="text" name="first_name" autocomplete="given-name" required>

               <label for="middle-name">Middle Name</label>
               <input id="middle-name" type="text" name="middle_name" autocomplete="additional-name">

               <label for="lrn">Learner Reference Number (LRN)</label>
               <input id="lrn" type="text" name="lrn" inputmode="numeric" pattern="[0-9]{12}" placeholder="12-digit LRN" required>

               <label for="birthday">Birthday</label>
               <input id="birthday" type="date" name="birthday" required>

               <label for="age">Age</label>
               <input id="age" type="number" name="age" min="10" max="25" required>

               <span class="field-label">Gender</span>
               <label class="option"><input type="radio" name="gender" value="male" required> Male</label>
               <label class="option"><input type="radio" name="gender" value="female"> Female</label>
               <label class="option"><input type="radio" name="gender" value="other"> Other</label>
           </fieldset>

           <fieldset>
               <legend>Contact and Address</legend>

               <label for="email">Email Address</label>
               <input id="email" type="email" name="email" autocomplete="email" required>

               <label for="phone">Mobile Number</label>
               <input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="09XX XXX XXXX" required>

               <label for="address">House No. and Street</label>
               <input id="address" type="text" name="address" autocomplete="street-address" required>

               <label for="barangay">Barangay</label>
               <input id="barangay" type="text" name="barangay" required>

               <label for="city">City or Municipality</label>
               <input id="city" type="text" name="city" required>

               <label for="province">Province</label>
               <input id="province" type="text" name="province" required>
           </fieldset>

           <fieldset>
               <legend>Enrollment Details</legend>

               <label for="grade-level">Grade Level</label>
               <select id="grade-level" name="grade_level" required>
                   <option value="">Select grade level</option>
                   <option value="11">Grade 11</option>
                   <option value="12">Grade 12</option>
               </select>

               <span class="field-label">Preferred Strand or Cluster</span>
               <label class="option"><input type="radio" name="cluster" value="assh-comms" required> ASSH-COMMS</label>
               <label class="option"><input type="radio" name="cluster" value="assh-soc-sci"> ASSH-SOC SCI</label>
               <label class="option"><input type="radio" name="cluster" value="ben"> BEN</label>
               <label class="option"><input type="radio" name="cluster" value="techpro-ict"> TECHPRO ICT</label>
           </fieldset>

           <fieldset>
               <legend>Parent or Guardian</legend>

               <label for="guardian-name">Full Name</label>
               <input id="guardian-name" type="text" name="guardian_name" required>

               <label for="relationship">Relationship to Student</label>
               <input id="relationship" type="text" name="relationship" required>

               <label for="guardian-phone">Contact Number</label>
               <input id="guardian-phone" type="tel" name="guardian_phone" required>

               <label for="emergency-contact">Emergency Contact Name and Number</label>
               <input id="emergency-contact" type="text" name="emergency_contact" required>
           </fieldset>

           <label class="consent">
               <input type="checkbox" name="information_consent" required>
               I confirm that the information provided is accurate.
           </label>

           <input type="submit" value="Submit Enrollment">
           <input type="reset" value="Clear Form">
        </form>
    </body>
</html>
